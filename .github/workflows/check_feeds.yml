name: Check feeds

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.check_feeds
      - uses: actions/upload-artifact@v4
        with:
          name: feed-report
          path: feed_report.csv
