name: Daily clean-up

on:
  schedule:
    - cron: "37 20 * * *"   # 20:37 UTC = 02:07 India time
  workflow_dispatch: {}

jobs:
  cleanup:
    # If scheduled runs ever move to the optional free server (docs/SERVER.md), set the
    # repository variable SCHEDULE_ON_GITHUB=off to stop them here. Manual runs always work.
    if: github.event_name != 'schedule' || vars.SCHEDULE_ON_GITHUB != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Delete articles older than 30 days, keep counts; delete accounts unused for 12 months
        run: python -m pipeline.cleanup
