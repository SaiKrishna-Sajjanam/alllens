name: Daily clean-up

on:
  schedule:
    - cron: "37 20 * * *"   # 20:37 UTC = 02:07 India time
  workflow_dispatch: {}

jobs:
  cleanup:
    # Scheduled runs move to the free server (docs/SERVER.md): set the repository variable
    # SCHEDULE_ON_GITHUB=off to stop them here. "Run workflow" by hand always works.
    if: github.event_name != 'schedule' || vars.SCHEDULE_ON_GITHUB != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Delete articles older than 30 days, keep counts; warn/delete long-inactive accounts
        run: python -m pipeline.cleanup
