name: Collect news

on:
  schedule:
    - cron: "7 */3 * * *"   # every 3 hours, at 7 past (UTC); fits the free 2,000 minutes a month
  workflow_dispatch:
    inputs:
      regroup:
        description: "Clear all story groupings and group every article again (articles are kept; follows of old stories are lost)"
        type: boolean
        default: false
      retag:
        description: "Tag every stored article again (after changing places, topics or source topics); stories and follows are kept"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    # If scheduled runs ever move to the optional free server (docs/SERVER.md), set the
    # repository variable SCHEDULE_ON_GITHUB=off to stop them here. Manual runs always work.
    if: github.event_name != 'schedule' || vars.SCHEDULE_ON_GITHUB != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMBEDDER: multilingual
      GROUP_THRESHOLD: ${{ vars.GROUP_THRESHOLD }}   # optional repository variable; default 0.905
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"
      # The installed packages (PyTorch etc.) are cached whole, so a run starts in seconds
      # instead of spending 2-3 minutes installing. They are rebuilt only when the
      # requirement files change.
      - uses: actions/cache@v4
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-ml.txt') }}
      - name: Install packages (only when not cached)
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-ml.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small
      - name: Collect, tag and group into stories
        run: .venv/bin/python -m pipeline.collect ${{ inputs.regroup && '--regroup' || '' }} ${{ inputs.retag && '--retag' || '' }}
