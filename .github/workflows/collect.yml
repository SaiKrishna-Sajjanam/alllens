name: Collect news

on:
  schedule:
    # Every hour, at 7 minutes past. The repository is public, so GitHub Actions minutes are free and
    # unlimited. A run takes about 5-15 minutes; the concurrency group below never lets two overlap.
    # GitHub may start a scheduled run late or skip one when its machines are busy.
    # If the repository is ever made private again, go back to every 8 hours ("37 0,8,16 * * *"),
    # which fits a private repository's free 2,000 minutes a month.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      regroup:
        description: "Clear all story groupings and group every article again (articles are kept; follows of old stories are lost)"
        type: boolean
        default: false
      retag:
        description: "Tag every stored article again (after changing places, topics or source topics); stories and follows are kept"
        type: boolean
        default: false
      check_pictures:
        description: "Remove this week's picture links too heavy for phones (once, after the picture check was added)"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # A normal run takes 5-15 minutes; the limit only stops a run that hangs.
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMBEDDER: multilingual
      # Headline translation (docs/TRANSLATE.md); skipped while these secrets are not set.
      TRANSLATE_URL: ${{ secrets.TRANSLATE_URL }}
      TRANSLATE_TOKEN: ${{ secrets.TRANSLATE_TOKEN }}
      TRANSLATE_LANGS: ${{ vars.TRANSLATE_LANGS }}   # optional, e.g. "te,ta": always translate into these
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"
      # The installed packages (PyTorch etc.) are cached whole, so a run starts in seconds
      # instead of spending 2-3 minutes installing. They are rebuilt only when the
      # requirement files change.
      - uses: actions/cache@v4
        id: venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt', 'requirements-ml.txt') }}
      - name: Install packages (only when not cached)
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt -r requirements-ml.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small
      - name: Collect, tag and group into stories
        run: .venv/bin/python -m pipeline.collect ${{ inputs.regroup && '--regroup' || '' }} ${{ inputs.retag && '--retag' || '' }} ${{ inputs.check_pictures && '--check-pictures' || '' }}
