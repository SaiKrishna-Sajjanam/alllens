name: Collect news

on:
  schedule:
    - cron: "7 */2 * * *"   # every 2 hours, at 7 past (UTC)
  workflow_dispatch:
    inputs:
      regroup:
        description: "Clear all story groupings and group every article again (articles are kept; follows of old stories are lost)"
        type: boolean
        default: false
      retag:
        description: "Tag every stored article again (after changing places, topics or source topics); stories and follows are kept"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMBEDDER: multilingual
      GROUP_THRESHOLD: ${{ vars.GROUP_THRESHOLD }}   # optional repository variable; default 0.905
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small
      - run: pip install -r requirements.txt -r requirements-ml.txt
      - name: Collect, tag and group into stories
        run: python -m pipeline.collect ${{ inputs.regroup && '--regroup' || '' }} ${{ inputs.retag && '--retag' || '' }}
