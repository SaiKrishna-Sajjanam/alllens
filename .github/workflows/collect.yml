name: Collect news

on:
  schedule:
    - cron: "7 */2 * * *"   # every 2 hours, at 7 past (UTC)
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EMBEDDER: multilingual
      GROUP_THRESHOLD: ${{ vars.GROUP_THRESHOLD }}   # optional repository variable; default 0.88
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small
      - run: pip install -r requirements.txt -r requirements-ml.txt
      - name: Collect, tag and group into stories
        run: python -m pipeline.collect
