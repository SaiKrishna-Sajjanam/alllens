name: Tests

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
      EMBEDDER: lexical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pipeline tests (SQLite and Postgres)
        run: python -m unittest discover -s tests -v
      - name: Security rules test
        run: |
          createdb -h localhost -U postgres rls
          for f in supabase/tests/auth_stub.sql supabase/migrations/*.sql supabase/tests/rls_test.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d rls -f "$f"
          done
        env:
          PGPASSWORD: test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build          # also type-checks every page
      - run: npm run typecheck
